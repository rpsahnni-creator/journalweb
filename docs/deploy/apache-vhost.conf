# Sample Apache virtual host for journal.srtc.ac.in
# DocumentRoot must be the Laravel /public directory, not the project root.
# Pointing Apache at the project root would expose .env, composer.lock, and storage/.

<VirtualHost *:80>
    ServerName journal.srtc.ac.in
    Redirect permanent / https://journal.srtc.ac.in/
</VirtualHost>

<VirtualHost *:443>
    ServerName journal.srtc.ac.in

    DocumentRoot /var/www/journal-system/public

    <Directory /var/www/journal-system/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/journal.srtc.ac.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/journal.srtc.ac.in/privkey.pem
</VirtualHost>
