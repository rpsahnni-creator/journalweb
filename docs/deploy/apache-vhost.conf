# Sample Apache virtual host for journal.srtc.ac.in
# Adjust DocumentRoot to the real checkout path on the server.

# DocumentRoot must be the Laravel /public directory, not the project root.
# public/index.php is the only PHP entry point that should be web-accessible.
# Pointing Apache at the project root would expose .env, composer.lock,
# storage/, and other sensitive files.

<VirtualHost *:80>
    ServerName journal.srtc.ac.in

    DocumentRoot /var/www/journal-system/public

    <Directory /var/www/journal-system/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
